name: Feature request
description: Suggest a portable, privacy-safe improvement.
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, credentials, raw prompts/responses, logs, transcripts, or client data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior, supported CLI agents, platforms, and privacy boundary.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, credentials, private paths, raw transcripts, and client data.
          required: true
