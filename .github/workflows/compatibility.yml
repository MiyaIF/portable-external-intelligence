name: compatibility

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: compatibility-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps -e .

      - name: Certify isolated clean clone lifecycle
        run: python scripts/certify-public-clone.py --source . --output artifacts/public-clone-receipt.json --offline-fixtures

      - name: Run host contract assertions
        run: python -m unittest tests.compatibility.test_all_host_contracts tests.certification.test_receipt_contract tests.certification.test_missing_host_blocks_completion

      - name: Verify dependency and source contracts
        run: |
          python scripts/verify-dependency-lock.py --pyproject pyproject.toml --build-lock requirements-build.lock --runtime-lock requirements-runtime.lock --ci-lock requirements-ci.lock --workflow-dir .github/workflows
          python scripts/audit-production-source.py --repo . --json

  compatibility-status:
    name: compatibility
    needs: compatibility
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      REQUIRED_RESULT: ${{ needs.compatibility.result }}
    steps:
      - name: Require every compatibility matrix job to succeed
        shell: bash
        run: test "$REQUIRED_RESULT" = "success"
