name: release-attestation

on:
  workflow_dispatch:
    inputs:
      evidence_commit:
        description: "Exact 40-hex public evidence commit SHA"
        required: true
        type: string

concurrency:
  group: release-attestation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release-attestation:
    name: release-attestation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EVIDENCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "evidence_commit must be exactly 40 hexadecimal characters" >&2
            exit 1
          fi
          if [[ ! "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "repository default branch contains unsupported characters" >&2
            exit 1
          fi
          git check-ref-format --branch "$DEFAULT_BRANCH"

      - name: Checkout exact evidence commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EVIDENCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and default-branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EVIDENCE_COMMIT" ]]
          git fetch --no-tags --prune origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install hash-locked dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps -e .

      - name: Collect exact-commit prerequisite runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run list --commit "$EVIDENCE_COMMIT" --limit 100 --json name,databaseId,conclusion,headSha > artifacts/workflow-runs.json
          python -c 'import json; from pathlib import Path; from ei.release import REQUIRED_WORKFLOW_NAMES; rows=json.loads(Path("artifacts/workflow-runs.json").read_text(encoding="utf-8")); selected={}; [selected.setdefault(row.get("name"), {"run_id": row.get("databaseId"), "conclusion": row.get("conclusion"), "head_sha": row.get("headSha")}) for row in rows if row.get("name") in REQUIRED_WORKFLOW_NAMES]; Path("release/prerequisites.json").write_text(json.dumps(selected, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")'

      - name: Verify fixed release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/verify-release-evidence.py \
            --manifest release/evidence-manifest.json \
            --evidence-commit "$EVIDENCE_COMMIT" \
            --prerequisites release/prerequisites.json \
            --attestation-output artifacts/post-push-attestation.json \
            --output artifacts/release-report.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
