[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-external-intelligence"
version = "1.0.0"
description = "Portable external intelligence lifecycle engine for CLI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "MiyaIF", email = "103426917+MiyaIF@users.noreply.github.com"}]
requires-python = ">=3.11"
keywords = ["cli-agents", "external-intelligence", "knowledge-management", "privacy", "retrieval"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["cryptography==50.0.1"]

[project.urls]
Homepage = "https://github.com/MiyaIF/portable-external-intelligence"
Repository = "https://github.com/MiyaIF/portable-external-intelligence"
Issues = "https://github.com/MiyaIF/portable-external-intelligence/issues"
Security = "https://github.com/MiyaIF/portable-external-intelligence/security/advisories/new"

[project.scripts]
ei = "ei.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
